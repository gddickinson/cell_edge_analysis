[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "piezo1-analysis"
version = "1.0.0"
description = "PIEZO1 protein distribution and membrane curvature analysis from TIRF microscopy"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "matplotlib>=3.4.0",
    "PyQt6>=6.2.0",
    "opencv-python>=4.5.0",
    "scikit-image>=0.18.0",
    "tifffile>=2021.8.30",
]

[project.optional-dependencies]
test = [
    "pytest>=6.2.0",
    "pytest-qt>=4.0.0",
]

[project.scripts]
piezo1-analysis = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
